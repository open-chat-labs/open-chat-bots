<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" width="440" height="720" role="img" aria-label="ChatMan">
  <!--
    ChatMan's image, at the app's aspect ratio (440 by 720): OpenChat shows it in the card's frame
    box whenever there's no app to show. Its background is opaque, so it reads the same on a light
    or a dark page. No fonts, scripts or references. The maze is a real one, built as the game
    builds them (src/games/chatman/maze.ts), and drawn as the page draws it (src/app/chatman/draw.ts):
    ChatMan, the OpenChat logo, heading left along his row, with two spam bots out of the pen.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="-1" x2="0" y2="1" gradientUnits="userSpaceOnUse"><stop stop-color="#FBB03B"/><stop offset="1" stop-color="#F05A24"/></linearGradient>
