<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" width="440" height="600" role="img" aria-label="Backgammon">
  <!--
    Backgammon's image, at the app's aspect ratio (440 by 600): OpenChat shows it in the card's
    frame box whenever there's no app to show. Its background is opaque, in OpenChat's theme, light
    or dark (below). No fonts, scripts or references. The board is drawn as the page draws it
    (src/app/backgammon/view.ts), with a game under way, from the light checkers' side.
  -->
  <!-- OpenChat names its theme in the image's fragment, as it does in the app's, eg.
       backgammon.svg#oc_theme=dark, which targets the group below. In a dark one, the colours are
       the page's dark ones (style.css). -->
  <style>
    :root:has([id="oc_theme=dark"]:target) [fill="#faf8ef"] { fill: #1b1a19 }
    :root:has([id="oc_theme=dark"]:target) [fill="#7a5230"] { fill: #4f3520 }
    :root:has([id="oc_theme=dark"]:target) [fill="#2f6b4f"] { fill: #24533d }
    :root:has([id="oc_theme=dark"]:target) [fill="#d9bf8c"] { fill: #b39a6c }
    :root:has([id="oc_theme=dark"]:target) [fill="#a3412f"] { fill: #843426 }
    :root:has([id="oc_theme=dark"]:target) [fill="#5e3f25"] { fill: #3d2918 }
    :root:has([id="oc_theme=dark"]:target) [fill="#f3eee2"] { fill: #e6dfd0 }
    :root:has([id="oc_theme=dark"]:target) [fill="#2c2825"] { fill: #1f1c1a }
  </style>
