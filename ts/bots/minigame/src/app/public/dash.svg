<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" width="440" height="720" role="img" aria-label="Dash Race">
  <!--
    The Dash Race's image, at the app's aspect ratio (440 by 720): OpenChat shows it in the card's
    frame box whenever there's no app to show. Its background is opaque, in OpenChat's theme, light
    or dark (below). No fonts, scripts or references. A stretch of a course drawn as the page draws
    it (src/app/dash/view.ts), the runner jumping a pit, with another racer ahead, and under it,
    the line with everyone's dot as far along as they've got.
  -->
  <!-- OpenChat names its theme in the image's fragment, as it does in the app's, eg.
       dash.svg#oc_theme=dark, which targets the group below. In a dark one, the colours are the
       page's dark ones (style.css). -->
  <style>
    :root:has([id="oc_theme=dark"]:target) [fill="#faf8ef"] { fill: #1b1a19 }
    :root:has([id="oc_theme=dark"]:target) [fill="#ffffff"] { fill: #26241f }
    :root:has([id="oc_theme=dark"]:target) [fill="#eee9e1"] { fill: #34312a }
    :root:has([id="oc_theme=dark"]:target) [fill="#efeae5"] { fill: #3a362e }
    :root:has([id="oc_theme=dark"]:target) [fill="#e6e0d4"] { fill: #3a362f }
    :root:has([id="oc_theme=dark"]:target) [stroke="#e6e0d4"] { stroke: #3a362f }
    :root:has([id="oc_theme=dark"]:target) [fill="#bbada0"] { fill: #4e463b }
    :root:has([id="oc_theme=dark"]:target) [fill="#2f7d4f"] { fill: #286b44 }
    :root:has([id="oc_theme=dark"]:target) [fill="#3b3630"] { fill: #ece7dd }
    :root:has([id="oc_theme=dark"]:target) [fill="#e8704a"] { fill: #f08a5d }
    :root:has([id="oc_theme=dark"]:target) [fill="#3f7fd0"] { fill: #5b9bef }
    :root:has([id="oc_theme=dark"]:target) [stroke="#3f7fd0"] { stroke: #5b9bef }
    :root:has([id="oc_theme=dark"]:target) [fill="#7a7267"] { fill: #a39b8f }
    :root:has([id="oc_theme=dark"]:target) [fill="#2fa36b"] { fill: #3cb87c }
  </style>
  <g id="oc_theme=dark"/>
  <rect width="440" height="720" fill="#faf8ef"/>
  <clipPath id="course"><rect x="28" y="160" width="384" height="320" rx="8"/></clipPath>
