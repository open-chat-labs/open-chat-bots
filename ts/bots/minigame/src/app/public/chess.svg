<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 740" width="440" height="740" role="img" aria-label="Chess">
  <!-- The card shows this at the app's aspect ratio, 440 by 740, whenever there's no app to show. It has
       its own background, so it reads the same on a light or a dark page. -->
  <rect width="440" height="740" fill="#26323b"/>
  <!-- The board, seen straight on, with a frame -->
  <rect x="34" y="100" width="372" height="372" rx="6" fill="#4a3b2e"/>
  <g>
    <rect x="44" y="110" width="44" height="44" fill="#f0d9b5"/><rect x="88" y="110" width="44" height="44" fill="#b58863"/><rect x="132" y="110" width="44" height="44" fill="#f0d9b5"/><rect x="176" y="110" width="44" height="44" fill="#b58863"/><rect x="220" y="110" width="44" height="44" fill="#f0d9b5"/><rect x="264" y="110" width="44" height="44" fill="#b58863"/><rect x="308" y="110" width="44" height="44" fill="#f0d9b5"/><rect x="352" y="110" width="44" height="44" fill="#b58863"/>
    <rect x="44" y="154" width="44" height="44" fill="#b58863"/><rect x="88" y="154" width="44" height="44" fill="#f0d9b5"/><rect x="132" y="154" width="44" height="44" fill="#b58863"/><rect x="176" y="154" width="44" height="44" fill="#f0d9b5"/><rect x="220" y="154" width="44" height="44" fill="#b58863"/><rect x="264" y="154" width="44" height="44" fill="#f0d9b5"/><rect x="308" y="154" width="44" height="44" fill="#b58863"/><rect x="352" y="154" width="44" height="44" fill="#f0d9b5"/>
    <rect x="44" y="198" width="44" height="44" fill="#f0d9b5"/><rect x="88" y="198" width="44" height="44" fill="#b58863"/><rect x="132" y="198" width="44" height="44" fill="#f0d9b5"/><rect x="176" y="198" width="44" height="44" fill="#b58863"/><rect x="220" y="198" width="44" height="44" fill="#f0d9b5"/><rect x="264" y="198" width="44" height="44" fill="#b58863"/><rect x="308" y="198" width="44" height="44" fill="#f0d9b5"/><rect x="352" y="198" width="44" height="44" fill="#b58863"/>
    <rect x="44" y="242" width="44" height="44" fill="#b58863"/><rect x="88" y="242" width="44" height="44" fill="#f0d9b5"/><rect x="132" y="242" width="44" height="44" fill="#b58863"/><rect x="176" y="242" width="44" height="44" fill="#f0d9b5"/><rect x="220" y="242" width="44" height="44" fill="#b58863"/><rect x="264" y="242" width="44" height="44" fill="#f0d9b5"/><rect x="308" y="242" width="44" height="44" fill="#b58863"/><rect x="352" y="242" width="44" height="44" fill="#f0d9b5"/>
    <rect x="44" y="286" width="44" height="44" fill="#f0d9b5"/><rect x="88" y="286" width="44" height="44" fill="#b58863"/><rect x="132" y="286" width="44" height="44" fill="#f0d9b5"/><rect x="176" y="286" width="44" height="44" fill="#b58863"/><rect x="220" y="286" width="44" height="44" fill="#f0d9b5"/><rect x="264" y="286" width="44" height="44" fill="#b58863"/><rect x="308" y="286" width="44" height="44" fill="#f0d9b5"/><rect x="352" y="286" width="44" height="44" fill="#b58863"/>
    <rect x="44" y="330" width="44" height="44" fill="#b58863"/><rect x="88" y="330" width="44" height="44" fill="#f0d9b5"/><rect x="132" y="330" width="44" height="44" fill="#b58863"/><rect x="176" y="330" width="44" height="44" fill="#f0d9b5"/><rect x="220" y="330" width="44" height="44" fill="#b58863"/><rect x="264" y="330" width="44" height="44" fill="#f0d9b5"/><rect x="308" y="330" width="44" height="44" fill="#b58863"/><rect x="352" y="330" width="44" height="44" fill="#f0d9b5"/>
    <rect x="44" y="374" width="44" height="44" fill="#f0d9b5"/><rect x="88" y="374" width="44" height="44" fill="#b58863"/><rect x="132" y="374" width="44" height="44" fill="#f0d9b5"/><rect x="176" y="374" width="44" height="44" fill="#b58863"/><rect x="220" y="374" width="44" height="44" fill="#f0d9b5"/><rect x="264" y="374" width="44" height="44" fill="#b58863"/><rect x="308" y="374" width="44" height="44" fill="#f0d9b5"/><rect x="352" y="374" width="44" height="44" fill="#b58863"/>
    <rect x="44" y="418" width="44" height="44" fill="#b58863"/><rect x="88" y="418" width="44" height="44" fill="#f0d9b5"/><rect x="132" y="418" width="44" height="44" fill="#b58863"/><rect x="176" y="418" width="44" height="44" fill="#f0d9b5"/><rect x="220" y="418" width="44" height="44" fill="#b58863"/><rect x="264" y="418" width="44" height="44" fill="#f0d9b5"/><rect x="308" y="418" width="44" height="44" fill="#b58863"/><rect x="352" y="418" width="44" height="44" fill="#f0d9b5"/>
  </g>
  <!-- The pieces are the Unicode chess glyphs, in whatever serif font the viewer has -->
  <g font-family="Georgia, 'Times New Roman', Times, serif" font-size="36" text-anchor="middle">
    <g fill="#ffffff" stroke="#2a2a2a" stroke-width="1">
      <text x="154" y="320.32">♗</text>
      <text x="242" y="320.32">♙</text>
      <text x="154" y="364.32">♙</text>
      <text x="198" y="364.32">♙</text>
      <text x="286" y="364.32">♘</text>
      <text x="66" y="408.32">♙</text>
      <text x="110" y="408.32">♙</text>
      <text x="286" y="408.32">♙</text>
      <text x="330" y="408.32">♙</text>
      <text x="374" y="408.32">♙</text>
      <text x="66" y="452.32">♖</text>
      <text x="198" y="452.32">♕</text>
      <text x="242" y="452.32">♔</text>
      <text x="374" y="452.32">♖</text>
    </g>
    <g fill="#111111">
      <text x="66" y="144.32">♜</text>
      <text x="198" y="144.32">♛</text>
      <text x="242" y="144.32">♚</text>
      <text x="374" y="144.32">♜</text>
      <text x="66" y="188.32">♟</text>
      <text x="110" y="188.32">♟</text>
      <text x="242" y="188.32">♝</text>
      <text x="286" y="188.32">♟</text>
      <text x="330" y="188.32">♟</text>
      <text x="374" y="188.32">♟</text>
      <text x="154" y="232.32">♞</text>
      <text x="198" y="232.32">♟</text>
      <text x="286" y="232.32">♞</text>
      <text x="154" y="276.32">♝</text>
      <text x="242" y="276.32">♟</text>
    </g>
  </g>
  <!-- The name, under the board -->
  <text x="220" y="588" font-family="Georgia, 'Times New Roman', Times, serif" font-size="76" font-weight="bold" fill="#f5f5f7" text-anchor="middle">Chess</text>
  <text x="220" y="636" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#b9c4cc" text-anchor="middle">10 minutes each</text>
</svg>
