on:
  pull_request:
    branches:
      - main

name: Backend linting and unit tests

jobs:
  fmt:
    name: run fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all --manifest-path rs/Cargo.toml -- --check

  clippy:
    name: run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
      # The SDK without features too, as most bots build it that way. Across the workspace, the
      # bridges would turn its `bridge` feature on.
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --tests -p oc_bots_sdk --manifest-path rs/Cargo.toml -- -D warnings
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --tests --manifest-path rs/Cargo.toml -- -D warnings
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --tests --all-features --manifest-path rs/Cargo.toml -- -D warnings

  unit_tests:
    name: run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all-features --manifest-path rs/Cargo.toml
