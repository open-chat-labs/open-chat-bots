on:
  pull_request:
    branches:
      - main

name: Backend linting and unit tests

jobs:
  fmt:
    name: run fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all --manifest-path rs/Cargo.toml -- --check

  clippy:
    name: run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
      # Without the bridges too, which turn the SDK's `bridge` feature on across the workspace, so
      # that the SDKs and example bots are linted as most bots build them
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --tests --workspace --exclude oc_bridge_core --exclude oc_discord_bridge --exclude oc_telegram_bridge --exclude oc_twitch_bridge --manifest-path rs/Cargo.toml -- -D warnings
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --tests --manifest-path rs/Cargo.toml -- -D warnings
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --tests --all-features --manifest-path rs/Cargo.toml -- -D warnings

  unit_tests:
    name: run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all-features --manifest-path rs/Cargo.toml
