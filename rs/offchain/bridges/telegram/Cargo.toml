[package]
name = "oc_telegram_bridge"
version = "0.1.0"
edition.workspace = true

# Bridges Telegram groups with OpenChat groups and public channels, both ways. Runs on AWS Lambda,
# as Telegram and OpenChat both deliver to it over HTTP. It can run as a server locally.

[dependencies]
anyhow = "1"
async-trait = { workspace = true }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
axum = { workspace = true }
lambda_http = "1"
oc_bots_sdk = { path = "../../../sdk", features = ["bridge"] }
oc_bots_sdk_offchain = { path = "../../sdk" }
oc_bridge_core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
ic-agent = { workspace = true }
tower = { version = "0.5", features = ["util"] }
