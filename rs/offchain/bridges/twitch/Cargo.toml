[package]
name = "oc_twitch_bridge"
version = "0.1.0"
edition.workspace = true

# Bridges Twitch channels' chats with OpenChat groups and public channels, both ways. Runs as a
# long-lived process, since it holds a WebSocket to Twitch's EventSub, and paces what the bot sends
# to Twitch's chat limits, which apply to the bot across every channel.

[dependencies]
anyhow = "1"
async-trait = { workspace = true }
axum = { workspace = true }
futures-util = "0.3"
oc_bots_sdk = { path = "../../../sdk", features = ["bridge"] }
oc_bots_sdk_offchain = { path = "../../sdk" }
oc_bridge_core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = "2"

[dev-dependencies]
ic-agent = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
