[package]
name = "oc_discord_bridge"
version = "0.1.0"
edition.workspace = true

# Bridges Discord channels with OpenChat groups and channels, both ways. Runs as a long-lived
# process, since Discord only sends channels' messages over its gateway's websocket.

[dependencies]
anyhow = "1"
async-trait = { workspace = true }
axum = { workspace = true }
oc_bots_sdk = { path = "../../../sdk", features = ["bridge"] }
oc_bridge_core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = "2"
